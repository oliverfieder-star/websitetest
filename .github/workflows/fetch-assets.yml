# Holt die von Higgsfield generierten Medien in das Repo.
# Die Build-Umgebung erreicht den Higgsfield-CDN nicht direkt; der
# GitHub-Runner schon.
name: fetch-assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medien laden
        run: |
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3HwhP6y3EJ5uDvH1ffTg5H1lYGM"
          mkdir -p design/assets

          # Porträt Oliver Fieder (nano_banana, zwei Varianten)
          curl -fsSL -o design/assets/portraet-v1.png "$base/hf_20260816_144453_7d2dffb9-2333-484a-a996-43d2f6e0ad2c.png"
          curl -fsSL -o design/assets/portraet-v2.png "$base/hf_20260816_144453_feb4d932-bce5-49ac-ab74-505b861d11a8.png"

          ls -la design/assets
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/assets
          git commit -m "Higgsfield-Porträt Oliver Fieder (zwei Varianten)"
          git push

# Holt die von Higgsfield generierten Medien in das Repo.
# Die Build-Umgebung erreicht den Higgsfield-CDN nicht direkt; der
# GitHub-Runner schon. Videos werden zusätzlich keyframe-dicht
# re-enkodiert (-g 6), damit Scroll-Scrubbing butterweich läuft.
name: fetch-assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Medien laden
        run: |
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3HwhP6y3EJ5uDvH1ffTg5H1lYGM"
          mkdir -p public/media design/assets

          # Richtung B — Werkfilm (Videos)
          curl -fsSL -o /tmp/hobel.mp4   "$base/hf_20260815_154830_b90e45ac-9d05-48f0-9864-56e05090d333.mp4"
          curl -fsSL -o /tmp/fenster.mp4 "$base/hf_20260815_154846_4f3a49fe-17f8-4b31-9817-12b33416bb67.mp4"

          # Scrub-Fassungen: dichte Keyframes, stumm, 1280 breit
          ffmpeg -y -i /tmp/hobel.mp4   -an -vf scale=1280:-2 -g 6 -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/hobel-scrub.mp4
          ffmpeg -y -i /tmp/fenster.mp4 -an -vf scale=1280:-2 -g 6 -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/fenster-scrub.mp4
          # Abspiel-Fassungen (Vorspann), etwas kleiner
          ffmpeg -y -i /tmp/hobel.mp4   -an -vf scale=1280:-2 -crf 26 -pix_fmt yuv420p -movflags +faststart public/media/hobel.mp4
          ffmpeg -y -i /tmp/fenster.mp4 -an -vf scale=1280:-2 -crf 26 -pix_fmt yuv420p -movflags +faststart public/media/fenster.mp4
          # Poster
          ffmpeg -y -i /tmp/hobel.mp4 -frames:v 1 -q:v 3 public/media/hobel-poster.jpg

          # Richtung A — helle Werkstatt / Richtung C — Material-Makros
          curl -fsSL -o design/assets/werkstatt-hell.png "$base/hf_20260815_154834_58294f8c-8499-4a10-8559-2420b9adae05.png"
          curl -fsSL -o design/assets/kalkputz.png       "$base/hf_20260815_154834_8e40d282-3f44-4f74-9320-565587c8a175.png"
          curl -fsSL -o design/assets/eiche-makro.png    "$base/hf_20260815_154834_2be93d3b-7542-46b9-89a8-f4363b68ef86.png"

          ls -la public/media design/assets
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/media design/assets
          git commit -m "Higgsfield-Medien: Werkfilm-Clips (Scrub-Fassung), helle Werkstatt, Material-Makros"
          git push

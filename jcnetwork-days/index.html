<title>JCNetwork Days RACI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --accent:#226D94; --accent-2:#17516f; --accent-wash:#e8f0f5;
  --ink:#14202a; --ink-2:#516069; --ink-3:#8a969e;
  --paper:#eef0f2; --card:#fff; --card-2:#f7f8f9;
  --line:#e1e5e9; --hair:#ebeef0;
  --late:#ae4436; --late-wash:#fbeeec;
  --soon:#9a7115; --soon-wash:#faf2e1;
  --done:#48796a; --done-wash:#e9f1ee;
  --r:14px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lift:0 1px 2px rgba(20,32,42,.04),0 8px 24px -12px rgba(20,32,42,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#68b0d4; --accent-2:#9bcde5; --accent-wash:#152e3c;
  --ink:#e8edf1; --ink-2:#9fadb6; --ink-3:#6f7d87;
  --paper:#0f1418; --card:#171d23; --card-2:#1c242b;
  --line:#28323a; --hair:#222b32;
  --late:#e28c7e; --late-wash:#33201c;
  --soon:#d3aa5c; --soon-wash:#2e2614;
  --done:#7fb9a5; --done-wash:#1a2a26;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --accent:#68b0d4; --accent-2:#9bcde5; --accent-wash:#152e3c;
  --ink:#e8edf1; --ink-2:#9fadb6; --ink-3:#6f7d87;
  --paper:#0f1418; --card:#171d23; --card-2:#1c242b;
  --line:#28323a; --hair:#222b32;
  --late:#e28c7e; --late-wash:#33201c;
  --soon:#d3aa5c; --soon-wash:#2e2614;
  --done:#7fb9a5; --done-wash:#1a2a26;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.disp{font-family:var(--disp);font-variation-settings:"SOFT" 0,"WONK" 0;letter-spacing:-.012em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Kopfzeile ---------- */
header.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;height:58px}
.mark{display:flex;align-items:baseline;gap:8px;flex:none}
.mark b{font:600 16px/1 var(--disp);letter-spacing:-.01em}
.mark span{font:400 11px/1 var(--mono);color:var(--ink-3);letter-spacing:.04em}
nav.tabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;
  font-size:14px;color:var(--ink-2);white-space:nowrap}
nav.tabs button:hover{background:var(--card);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--lift)}
.bar .sp{flex:1}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.me-btn:hover{border-color:var(--accent)}
.me-btn .nm{font-size:13.5px;font-weight:600;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font:600 11px var(--mono);color:#fff}
.av.sm{width:21px;height:21px;font-size:9px} .av.lg{width:44px;height:44px;font-size:16px}

main{max-width:1000px;margin:0 auto;padding:34px 24px 90px}

/* ---------- Begruessung + Zeitstrahl ---------- */
.hello{margin-bottom:30px}
.hello h1{font:500 34px/1.15 var(--disp);letter-spacing:-.018em}
.hello .sub{color:var(--ink-2);margin-top:6px;font-size:15px}
.hello .sub b{color:var(--ink);font-weight:600}
.trail{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 20px 13px}
.trail-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}
.trail-top .now{font-size:13.5px;color:var(--ink-2)}
.trail-top .now b{color:var(--ink);font-weight:600}
.trail-top .cd{font:500 13px var(--mono);color:var(--accent)}
.track{position:relative;height:3px;background:var(--hair);border-radius:2px;margin:0 0 9px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.track .pin{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--accent);
  border:2.5px solid var(--card);transform:translate(-50%,-50%)}
.ticks{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--ink-3)}
.ticks span{flex:1;text-align:center}
.ticks span:first-child{text-align:left} .ticks span:last-child{text-align:right}
.ticks span.on{color:var(--accent);font-weight:500}

/* ---------- Abschnitte ---------- */
section{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-h h2{font:600 19px/1.25 var(--disp);letter-spacing:-.012em}
.sec-h .n{font:400 13px var(--mono);color:var(--ink-3)}
.sec-h .more{margin-left:auto;font-size:13.5px;color:var(--accent);background:none;border:0;
  cursor:pointer;padding:2px 0}
.sec-h .more:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Aufgabenliste ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:12px 17px;border:0;background:none;width:100%;
  text-align:left;cursor:pointer;border-top:1px solid var(--hair);font:inherit;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--card-2)}
.tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;background:var(--card)}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--done);border-color:var(--done)}
.tick svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;display:none}
.tick.on svg{display:block}
.row .mid{flex:1;min-width:0}
.row .t{font-size:14.5px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.row.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.row .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;
  font-size:12.5px;color:var(--ink-3)}
.row .when{font:500 12.5px var(--mono);color:var(--ink-2);white-space:nowrap;flex:none;text-align:right}
.row .when.late{color:var(--late)} .row .when.soon{color:var(--soon)}
.row .fl{color:var(--late);flex:none;font-size:13px}
.tag{font-size:12px;color:var(--ink-3)}
.tag.dot::before{content:"·";margin-right:8px}
.own{display:inline-flex;gap:-4px;align-items:center}
.lead{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:11.5px;font-weight:600;line-height:1.6}
.pill.late{background:var(--late-wash);color:var(--late)}
.pill.soon{background:var(--soon-wash);color:var(--soon)}
.pill.done{background:var(--done-wash);color:var(--done)}
.pill.info{background:var(--accent-wash);color:var(--accent-2)}
.pill.plain{background:var(--card-2);color:var(--ink-2)}

/* ---------- Hinweiskarte ---------- */
.callout{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 18px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.callout:hover{border-color:var(--late)}
.callout .big{font:500 27px/1 var(--mono);color:var(--late);flex:none}
.callout .tx{flex:1;min-width:0}
.callout .tx b{display:block;font-size:14.5px;font-weight:600}
.callout .tx span{font-size:13px;color:var(--ink-2)}
.callout .go{color:var(--ink-3);font-size:18px;flex:none}

/* ---------- Bereichskarten ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:14px;align-items:flex-start}
.card:hover{border-color:var(--accent);box-shadow:var(--lift)}
.card .tx{flex:1;min-width:0}
.card h3{font:600 15.5px/1.3 var(--sans);letter-spacing:-.005em}
.card .who{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px}
.card .fig{font:400 12.5px var(--mono);color:var(--ink-3);margin-top:9px}
.card .fig .l{color:var(--late)}
.ring{flex:none;width:44px;height:44px;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--hair)} .ring .fg{stroke:var(--done);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;
  font:500 11px var(--mono);color:var(--ink-2)}

/* ---------- Zeitplan ---------- */
.ph{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;padding:15px 0;
  border-top:1px solid var(--hair);align-items:center}
.ph:first-of-type{border-top:0}
.ph.now{background:var(--accent-wash);border-radius:var(--r);padding-left:16px;padding-right:16px;border-top-color:transparent}
.ph h4{font:600 15px/1.3 var(--sans)}
.ph .dt{font:400 11.5px var(--mono);color:var(--ink-3);margin-top:2px}
.phbar{height:8px;border-radius:5px;background:var(--hair);display:flex;overflow:hidden;margin-bottom:7px}
.phbar i{height:100%}
.ph .mt{font-size:12.5px;color:var(--ink-2)}
.ph .mt b{font-weight:600}

/* ---------- Matrix ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button:hover{border-color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.mx-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:780px;width:100%}
table.mx th,table.mx td{padding:7px 7px;border-top:1px solid var(--hair);text-align:center}
table.mx thead th{position:sticky;top:0;background:var(--card-2);z-index:2;border-top:0;
  font:500 11px var(--mono);color:var(--ink-2);padding:10px 6px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
table.mx th.tn,table.mx td.tn{text-align:left;min-width:290px;position:sticky;left:0;
  background:var(--card);font-weight:400;font-size:13.5px}
table.mx thead th.tn{background:var(--card-2);z-index:3}
table.mx tbody tr:hover td,table.mx tbody tr:hover td.tn{background:var(--card-2)}
table.mx td.wd{font:400 11.5px var(--mono);color:var(--ink-3);white-space:nowrap}
.rc{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;
  font:600 11px var(--mono)}
.rc.A{background:var(--accent);color:#fff}
.rc.R{background:var(--accent-wash);color:var(--accent-2)}
.rc.C{background:var(--soon-wash);color:var(--soon)}
.rc.I{background:var(--card-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.rc.S{background:var(--done-wash);color:var(--done)}
.rc.opt{opacity:.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Team ---------- */
.grp-h{margin:26px 0 12px}
.grp-h h3{font:600 17px/1.3 var(--disp)}
.grp-h p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.grp-h:first-child{margin-top:0}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pc.nn{border-style:dashed}
.pc .top{display:flex;gap:12px;align-items:center}
.pc .nm{font-size:16px;font-weight:600;line-height:1.25}
.pc .rl{font-size:12.5px;color:var(--ink-2)}
.pc .ar{margin-top:11px;display:flex;flex-wrap:wrap;gap:5px}
.pc .fg{margin-top:11px;font:400 12.5px var(--mono);color:var(--ink-3)}
.pc .fg b{color:var(--ink);font-weight:600} .pc .fg .l{color:var(--late)}
.pc .ed{margin-top:12px;display:flex;gap:7px}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);padding:7px 13px;font-size:13.5px;
  font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.gho{border-color:transparent;background:none;color:var(--ink-2)}
.btn.gho:hover{background:var(--card-2);color:var(--ink)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;
  color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px;font-weight:600}
.toolrow{display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;
  font-size:13.5px;width:230px;max-width:100%}

/* ---------- Dialoge ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,27,.42);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.sheet{background:var(--card);border-radius:18px;box-shadow:0 24px 60px -18px rgba(0,0,0,.4);
  width:100%;max-width:580px;border:1px solid var(--line);overflow:hidden;margin:auto}
.sheet.wide{max-width:840px}
.sh-h{padding:20px 22px 16px;border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:flex-start}
.sh-h h3{font:500 21px/1.3 var(--disp);flex:1;letter-spacing:-.012em}
.sh-b{padding:20px 22px}
.sh-f{padding:14px 22px;border-top:1px solid var(--hair);display:flex;gap:9px;align-items:center;
  background:var(--card-2);flex-wrap:wrap}
.x{background:none;border:0;font-size:21px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px;flex:none}
.x:hover{color:var(--ink)}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14px;background:var(--card)}
.fld textarea{resize:vertical;min-height:74px;font-family:var(--sans)}
.fld .hint{font-size:12px;color:var(--ink-3);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:78px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:8px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--card);font-weight:400}
.checks label:has(input:checked){background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2)}
.checks input{margin:0;accent-color:var(--accent)}
.facts{display:flex;gap:26px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--hair);margin-bottom:17px}
.fact .k{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.fact .v{font-size:14.5px;font-weight:600}
.fact .v.late{color:var(--late)}
.fact .v span{font-weight:400;color:var(--ink-3);font-size:13px}
.role-line{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--hair)}
.role-line:first-of-type{border-top:0}
.role-line .lbl{flex:none;width:132px;font-size:13px;font-weight:600;color:var(--ink-2)}
.role-line .ppl{flex:1;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.who-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border-radius:999px;
  padding:3px 11px 3px 3px;font-size:13px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.pick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:11px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pick:hover{border-color:var(--accent);background:var(--accent-wash)}
.pick .nm{font-weight:600;font-size:14px;line-height:1.25;display:block}
.pick .rl{font-size:12px;color:var(--ink-3);line-height:1.3;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);
  color:var(--paper);padding:10px 17px;border-radius:10px;font-size:13.5px;
  box-shadow:var(--lift);max-width:calc(100% - 32px)}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:18px;
  flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--accent)}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--done)} .dot.off{background:var(--soon)}

@media (max-width:720px){
  body{font-size:14.5px}
  .bar-in{height:54px;padding:0 16px;gap:10px}
  .mark span{display:none}
  main{padding:26px 16px 80px}
  .hello h1{font-size:27px}
  .me-btn .nm{display:none} .me-btn{padding:4px}
  .ph{grid-template-columns:1fr;gap:8px}
  .ph.now{padding-left:14px;padding-right:14px}
  .two{grid-template-columns:1fr}
  .row{padding:11px 14px;gap:11px}
  .row .when{font-size:11.5px}
  .facts{gap:18px}
  .ticks{display:none}
  .trail{padding:15px 16px 13px}
  .trail-top{flex-direction:column;gap:3px}
  .role-line{flex-direction:column;gap:6px} .role-line .lbl{width:auto}
}
</style>

<header class="bar"><div class="bar-in">
  <div class="mark"><b class="disp">JCNetwork Days</b><span>WÜRZBURG 2026</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sp"></div>
  <button class="me-btn" id="meBtn" type="button">
    <span class="av" id="meAv"></span><span class="nm" id="meNm">Anmelden</span></button>
</div></header>

<main id="view"></main>
<div id="overlay"></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ==========================================================================
   JCNetwork Days 2026 — Planungsboard
   data.js kommt aus der RACI-Excel und wird nie veraendert. Darueber liegt
   nur eine Schicht aus Status, Flags, Notizen und ergaenzten Aufgaben,

/* --- Zeitcodes der Excel -> echte Daten -------------------------------- */
const DEFAULT_MS = { wahl:"2025-12-06", anms:"2026-10-01" };
let milestones = { ...DEFAULT_MS };
const WEEKDAY = { Mo:-3, Di:-2, Mi:-1, Do:0, Fr:1, Sa:2, So:3 };
function shiftMonths(d, n) {
  const x = new Date(d.getTime()), day = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));
  return x;
}
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
function codeToDate(code) {
  if (!code) return null;
  const c = String(code).trim();
  if (c === "Wahl") return parseISO(milestones.wahl);
  if (c === "AnmS") return parseISO(milestones.anms);
  if (c in WEEKDAY) { const d = new Date(EVENT_START.getTime()); d.setDate(d.getDate() + WEEKDAY[c]); return d; }
  let m = c.match(/^\+(\d+)([dwm])?$/);
  if (m) { const n = +m[1], u = m[2] || "d";
    if (u === "m") return shiftMonths(EVENT_END, n);
    const d = new Date(EVENT_END.getTime()); d.setDate(d.getDate() + n * (u === "w" ? 7 : 1)); return d; }
  m = c.match(/^(\d+)([wm])$/);
  if (m) { const n = +m[1];
    if (m[2] === "m") return shiftMonths(EVENT_START, -n);
    const d = new Date(EVENT_START.getTime()); d.setDate(d.getDate() - n * 7); return d; }
  return null;
}
const fmtDM = new Intl.DateTimeFormat("de-DE", { day:"numeric", month:"short" });
const fmtFull = new Intl.DateTimeFormat("de-DE", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
const fmtMon = new Intl.DateTimeFormat("de-DE", { month:"long", year:"numeric" });
const fmtWd = new Intl.DateTimeFormat("de-DE", { weekday:"long" });
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysTo = d => Math.round((d - today()) / DAY);

/** Datum in Alltagssprache — exakte Daten stehen im Detail. */
function humanDue(d) {
  if (!d) return "offen";
  const n = daysTo(d);
  if (n < -1) return `${-n} Tage drüber`;
  if (n === -1) return "gestern";
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  if (n < 7) return fmtWd.format(d);
  if (n < 14) return "nächste Woche";
  if (n < 75) return fmtDM.format(d);
  return fmtMon.format(d);
}

/* --- Aufgaben ----------------------------------------------------------- */
const STATUS = { offen:"Offen", laeuft:"Läuft", erledigt:"Erledigt", blockiert:"Hängt" };
const baseTasks = D.tasks.map((t, i) => ({
  key:"t" + i, area:AREAS[t[0]], title:t[1], max:t[2], min:t[3], raci:t[4], custom:false }));
let customTasks = [], overlay = new Map();
const allTasks = () => baseTasks.concat(customTasks);
const ov = k => overlay.get(k) || {};
const statusOf = k => ov(k).status || "offen";

function windowOf(t) {
  if (t.custom) return { start: t.startISO ? parseISO(t.startISO) : null, due: t.dueISO ? parseISO(t.dueISO) : null };
  const a = codeToDate(t.max), b = codeToDate(t.min);
  return { start:a, due: b || a };
}
function bucketOf(t) {
  if (statusOf(t.key) === "erledigt") return "done";
  const { start, due } = windowOf(t);
  if (!due) return "later";
  const n = daysTo(due);
  if (n < 0) return "late";
  if (start && daysTo(start) <= 0) return "now";
  if (start ? daysTo(start) <= 45 : n <= 45) return "soon";
  return "later";
}
const RANK = { late:0, now:1, soon:2, later:3, done:4 };

function involvement(t, p) {
  if (!p) return null;
  if (t.custom) {
    if (t.owner === p.id) return { letters:["A"], opt:false };
    if ((t.helpers || []).includes(p.id)) return { letters:["R"], opt:false };
    return null;
  }
  if (!covers(p, t.area)) return null;
  const letters = new Set(); let opt = true, any = false;
  for (const pos of p.pos) {
    const raw = t.raci[P[pos]];
    if (!raw) continue;
    any = true;
    if (!raw.endsWith("?")) opt = false;
    for (const ch of raw.replace("?", "")) letters.add(ch);
  }
  return any ? { letters:[...letters], opt } : null;
}
const isWork = i => !!i && (i.letters.includes("R") || i.letters.includes("A"));
const isSign = i => !!i && i.letters.includes("S");

function tasksFor(p, mode) {
  const out = [];
  for (const t of allTasks()) {
    const inv = involvement(t, p); if (!inv) continue;
    const w = isWork(inv);
    if (mode === "work" ? w : (!w && (!inv.opt || isSign(inv)))) out.push({ t, inv });
  }
  return out;
}
const sortTasks = rows => rows.sort((x, y) => {
  const a = RANK[bucketOf(x.t)], b = RANK[bucketOf(y.t)];
  if (a !== b) return a - b;
  const dx = windowOf(x.t).due, dy = windowOf(y.t).due;
  if (dx && dy && +dx !== +dy) return dx - dy;
  if (!dx) return 1; if (!dy) return -1;
  return x.t.title.localeCompare(y.t.title, "de");
});
const peopleWith = (t, l) => team.filter(p => { const i = involvement(t, p); return i && i.letters.includes(l); });

async function initStore() {
  overlay = new Map(Object.entries(lsGet(LS.state, {})));

  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }

  syncState = ["on", "geteilt mit dem Team"];
  const fail = e => { syncState = ["off", "Verbindung unterbrochen"]; console.warn(e); render(); };
  db.collection("state").onSnapshot(s => {
    overlay = new Map(s.docs.map(d => [d.id, d.data()]));
    lsSet(LS.state, Object.fromEntries(overlay)); render();
  }, fail);
  db.collection("custom").onSnapshot(s => {
    customTasks = s.docs.map(d => ({ ...d.data(), key:"c" + d.id, docId:d.id, custom:true }));

  customTasks = customTasks.filter(c => c.key !== t.key);

  if (db && t.docId) { try { await db.doc("custom/" + t.docId).delete(); } catch {} }

/** Eine Aufgabenzeile. Ohne RACI-Buchstaben — die stehen im Detail. */
function row(t, o = {}) {
  const b = bucketOf(t), { due } = windowOf(t), s = statusOf(t.key), f = ov(t.key).flag;
  const when = humanDue(due);
  const cls = b === "late" ? "late" : (b === "now" || b === "soon" ? "soon" : "");
  const meta = [];
  if (!o.hideArea) meta.push(`<span class="tag">${esc(t.area)}</span>`);
  if (o.showLead) {
    const a = peopleWith(t, "A").filter(p => p.name)[0] || peopleWith(t, "R").filter(p => p.name)[0];
    if (a) meta.push(`<span class="lead">${av(a, "sm")}${esc(dispName(a))}</span>`);
  }
  if (s === "laeuft") meta.push('<span class="pill plain">läuft</span>');
  if (s === "blockiert") meta.push('<span class="pill late">hängt</span>');
  if (t.custom) meta.push('<span class="pill info">ergänzt</span>');
  return `<div class="row${s === "erledigt" ? " done" : ""}">
    <span class="tick${s === "erledigt" ? " on" : ""}" role="button" tabindex="0"
      data-tick="${esc(t.key)}" aria-label="Als erledigt markieren">${CHECK}</span>
    <span class="mid" data-open="${esc(t.key)}" role="button" tabindex="0">
      <span class="t">${esc(t.title)}</span>
      ${meta.length ? `<span class="m">${meta.join("")}</span>` : ""}
    </span>
    ${f ? '<span class="fl" title="Geflaggt">●</span>' : ""}
    <span class="when ${cls}" data-open="${esc(t.key)}">${esc(when)}</span>
  </div>`;
}
const panel = rows => `<div class="panel">${rows.join("")}</div>`;
function ring(done, total) {
  const pct = total ? done / total : 0, r = 18, c = 2 * Math.PI * r;
  return `<span class="ring"><svg width="44" height="44" viewBox="0 0 44 44">
    <circle class="bg" cx="22" cy="22" r="${r}"></circle>
    <circle class="fg" cx="22" cy="22" r="${r}" stroke-dasharray="${(c * pct).toFixed(1)} ${c.toFixed(1)}"></circle>
  </svg><b>${Math.round(pct * 100)}</b></span>`;
}

  { id:"grund", n:"Grundsteine",        t:d => d > 180, w:"Dez 25 – Jun 26", s:"Grundsteine" },

  { id:"nach",  n:"Nachbereitung",      t:() => true,   w:"danach", s:"Danach" }
];
function phaseOf(due) {
  if (!due) return PHASES[PHASES.length - 1];
  const d = Math.round((EVENT_START - due) / DAY);
  return PHASES.find(p => p.t(d)) || PHASES[PHASES.length - 1];
}
const nowPhase = () => phaseOf(today()).id;

function matches(t) {
  if (filter.flag && !ov(t.key).flag) return false;
  if (filter.only && bucketOf(t) !== filter.only) return false;
  if (filter.q) { const s = filter.q.toLowerCase();
    if (!t.title.toLowerCase().includes(s) && !t.area.toLowerCase().includes(s)) return false; }
  return true;
}

      <div class="sec-h"><h2 class="disp">Bald</h2><span class="n">${soon.length}</span>
        ${soon.length > 5 ? '<button class="more" data-go="mine" type="button">alle ansehen</button>' : ""}</div>
      ${panel(soon.slice(0, 5).map(r => row(r.t)))}</section>` : ""}

    ${!work.length ? `<div class="empty"><b>Keine Aufgaben für dich</b>
      Deine Position ist in keinem deiner Bereiche als ausführend oder verantwortlich eingetragen.</div>` : ""}

    <section>
      <div class="sec-h"><h2 class="disp">Deine Bereiche</h2>
        <button class="more" data-go="areas" type="button">alle zwölf</button></div>
      <div class="cards">${(me.areas === ALL ? AREAS : me.areas).map(areaCard).join("")}</div>
    </section>

      <button class="lnk" data-go="mine" type="button">Alle ${work.length} Aufgaben von dir</button>
      ${watch.length ? `<button class="lnk" data-watch="1" type="button">${watch.length} Aufgaben, bei denen du nur gefragt oder informiert wirst</button>` : ""}
    </div>`;
}
function areaCard(a) {
  const ts = allTasks().filter(t => t.area === a);
  const done = ts.filter(t => bucketOf(t) === "done").length;
  const late = ts.filter(t => bucketOf(t) === "late").length;
  const lead = team.filter(p => p.grp === "pt" && p.areas !== ALL && p.areas.includes(a) && p.name)[0]
            || team.filter(p => p.grp === "pl" && p.areas !== ALL && p.areas.includes(a) && p.name)[0];
  return `<button class="card" data-area="${esc(a)}" type="button">
    ${ring(done, ts.length)}
    <span class="tx"><h3>${esc(a)}</h3>
      <span class="who">${lead ? av(lead, "sm") + esc(dispName(lead)) : "niemand zugeordnet"}</span>
      <span class="fig">${done}/${ts.length} erledigt${late ? ` · <span class="l">${late} drüber</span>` : ""}</span>
    </span></button>`;
}

/* --- Zeitplan ----------------------------------------------------------- */
function renderPlan() {
  const ts = allTasks().filter(matches), cur = nowPhase();
  return `<div class="hello"><h1 class="disp">Zeitplan</h1>
      <div class="sub">${ts.length} Aufgaben nach Deadline, gerechnet vom 3. Dezember 2026.</div></div>
    <div class="panel" style="padding:6px 20px">` +
    PHASES.map(ph => {
      const g = ts.filter(t => phaseOf(windowOf(t).due).id === ph.id);
      if (!g.length) return "";
      const done = g.filter(t => bucketOf(t) === "done").length;
      const late = g.filter(t => bucketOf(t) === "late").length;
      const open = g.length - done - late;
      const w = x => (x / g.length * 100).toFixed(1) + "%";
      const mine = me ? g.filter(t => isWork(involvement(t, me))).length : 0;
      return `<div class="ph${ph.id === cur ? " now" : ""}">
        <div><h4>${esc(ph.n)}</h4><div class="dt">${esc(ph.w)}</div></div>
        <div><div class="phbar">
            ${done ? `<i style="width:${w(done)};background:var(--done)"></i>` : ""}
            ${late ? `<i style="width:${w(late)};background:var(--late)"></i>` : ""}
            ${open ? `<i style="width:${w(open)};background:var(--accent)"></i>` : ""}</div>
          <div class="mt">${g.length} Aufgaben · ${done} erledigt${late ? ` · <b style="color:var(--late)">${late} drüber</b>` : ""}${mine ? ` · <b>${mine} bei dir</b>` : ""}</div>
        </div></div>`;
    }).join("") + `</div>`;
}

/* --- RACI-Matrix (die Excel-Ansicht) ------------------------------------ */
function renderMatrix() {
  const a = route.area || AREAS[0];
  const ts = allTasks().filter(t => t.area === a && matches(t));
  const cell = (t, pos) => {
    const raw = t.custom
      ? (t.owner && personById(t.owner) && personById(t.owner).pos.includes(pos) ? "A"
        : (t.helpers || []).some(h => personById(h) && personById(h).pos.includes(pos)) ? "R" : null)
      : t.raci[P[pos]];
    if (!raw) return "<td></td>";
    const opt = String(raw).endsWith("?");
    return `<td>${[...String(raw).replace("?", "")].map(l =>
      `<span class="rc ${l}${opt ? " opt" : ""}" title="${esc(ROLE[l] ? ROLE[l].lbl : l)}">${l}</span>`).join("")}</td>`;
  };
  return `<div class="hello"><h1 class="disp">RACI-Matrix</h1>
      <div class="sub">Die Excel-Ansicht — eine Zeile je Aufgabe, eine Spalte je Position.</div></div>
    <div class="chips">${AREAS.map(x =>
      `<button data-mx="${esc(x)}" aria-pressed="${x === a}" type="button">${esc(x)}</button>`).join("")}</div>
    <div class="mx-wrap"><table class="mx">
      <thead><tr><th class="tn">Aufgabe</th><th>Fenster ab</th><th>Deadline</th>
        ${POS.map(p => `<th title="${esc(POS_LABEL[p])}">${esc(p)}</th>`).join("")}</tr></thead>
      <tbody>${ts.map(t => { const { start, due } = windowOf(t);
        return `<tr data-open="${esc(t.key)}" style="cursor:pointer">
          <td class="tn">${esc(t.title)}</td>
          <td class="wd">${start ? esc(fmtDM.format(start)) + " " + String(start.getFullYear()).slice(2) : "–"}</td>
          <td class="wd">${due ? esc(fmtDM.format(due)) + " " + String(due.getFullYear()).slice(2) : "–"}</td>
          ${POS.map(p => cell(t, p)).join("")}</tr>`; }).join("")
        || `<tr><td class="tn" colspan="${POS.length + 3}">Keine Aufgaben für diese Filter.</td></tr>`}</tbody>
    </table></div>
    <div class="legend">${["A","R","C","I","S"].map(l =>
      `<span><span class="rc ${l}">${l}</span> ${esc(ROLE[l].lbl)}</span>`).join("")}
      <span><span class="rc R opt">R</span> in der Excel geklammert: nur falls zutreffend</span></div>`;
}

  openSheet(`
    <div class="sh-h"><div style="flex:1"><h3 class="disp">Nur zur Kenntnis</h3>
      <p style="font-size:13.5px;color:var(--ink-2);margin:6px 0 0">${rows.length} Aufgaben, bei denen du
      gefragt oder informiert wirst. Kein Arbeitsauftrag — jemand anderes macht sie.</p></div>
      <button class="x" data-close="1" type="button" aria-label="Schließen">&times;</button></div>
    <div class="sh-b" style="padding:0">${panel(rows.slice(0, 80).map(r => row(r.t, { showLead:true })))}
      ${rows.length > 80 ? `<p style="font-size:12.5px;color:var(--ink-3);padding:14px 22px;margin:0">… und ${rows.length - 80} weitere.</p>` : ""}</div>`, true);
  wireRows(document.getElementById("overlay"));
}

function aboutSheet() {
  openSheet(`
    <div class="sh-h"><h3 class="disp">Woher die Aufgaben kommen</h3>
      <button class="x" data-close="1" type="button" aria-label="Schließen">&times;</button></div>
    <div class="sh-b" style="font-size:14px;line-height:1.65">
      <p style="margin-top:0">Grundlage ist die RACI-Excel der JCNetwork Days mit
      <b>${allTasks().length} Aufgaben in zwölf Bereichen</b>. Sie verteilt Aufgaben auf Positionen —
      nicht auf Menschen. Hier kommt die Zuordnung des Projektteams dazu: eine Aufgabe ist deine, wenn
      <b>deine Position in der Zeile steht</b> und <b>der Bereich zu dir gehört</b>.</p>
      <p><b>Nur zwei der fünf Rollen sind Arbeit.</b> Wer etwas macht oder verantwortet, hat es auf dem
      Board. Wer gefragt oder informiert wird, findet es unter „Nur zur Kenntnis" — sonst hätte die
      Projektleitung hunderte vermeintlicher Aufgaben.</p>
      <p><b>Aus Kürzeln werden Termine.</b> Die Excel schreibt <span class="num">3m</span>,
      <span class="num">2w</span> oder <span class="num">Mo</span>. Gerechnet vom 3. Dezember 2026 sind das
      der 3. September, der 19. November und der Montag der Vorbereitungswoche.</p>
      <p><b>Der Status hängt an der Aufgabe, nicht an dir.</b> Jede Zeile hat genau eine verantwortliche
      Position. Hakt jemand ab, sehen es alle Beteiligten.</p>
      <p style="color:var(--ink-2);font-size:13px;margin-bottom:0">Die RACI ist bewusst kein starres Gerüst.
      Selbst angelegte Aufgaben sind als <span class="pill info">ergänzt</span> gekennzeichnet.</p>
    </div>`);
}

/* ======================================================================
   Rendern
   ====================================================================== */
const TABS = [["board", "Board"], ["mine", "Aufgaben"], ["areas", "Bereiche"],
              ["plan", "Zeitplan"], ["matrix", "Matrix"], ["team", "Team"]];
function wireRows(scope) {
  scope.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => taskSheet(el.dataset.open);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); taskSheet(el.dataset.open); } };
  });
  scope.querySelectorAll("[data-tick]").forEach(el => {
    const go = e => { e.stopPropagation();
      const k = el.dataset.tick;
      writeState(k, { status: statusOf(k) === "erledigt" ? "offen" : "erledigt" });
    };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } };
  });
}
function render() {
  if (!me) { document.getElementById("view").innerHTML = ""; return; }
  document.getElementById("meAv").style.background = me.color || "#667";
  document.getElementById("meAv").textContent = initials(me);
  document.getElementById("meNm").textContent = dispName(me);
  document.getElementById("tabs").innerHTML = TABS.map(([id, l]) =>
    `<button data-tab="${id}" aria-current="${route.v === id || (id === "areas" && route.v === "area")}" type="button">${esc(l)}</button>`).join("");

  const v = document.getElementById("view");
  v.innerHTML = route.v === "board" ? renderBoard()
    : route.v === "mine"  ? `<div class="hello"><h1 class="disp">Deine Aufgaben</h1>
        <div class="sub">Alles, was du machst oder verantwortest.</div></div>` + renderMine()
    : route.v === "areas" ? `<div class="hello"><h1 class="disp">Bereiche</h1>
        <div class="sub">Zwölf Bereiche aus der RACI, aufgeteilt auf die Projektleitung.</div></div>` + renderAreas()
    : route.v === "area"  ? renderArea(route.area)
    : route.v === "plan"  ? renderPlan()
    : route.v === "matrix"? renderMatrix()
    : renderTeam();

  if (route.v === "board" || route.v === "team")
    v.insertAdjacentHTML("beforeend", `<div class="foot">
      <span class="sync"><span class="dot ${syncState[0]}"></span>${esc(syncState[1])}</span>
      <button class="lnk" data-about="1" type="button">Woher die Aufgaben kommen</button>
      <button class="lnk" data-theme="1" type="button">Darstellung wechseln</button></div>`);

  wireRows(v);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    route = { v:b.dataset.tab, area: b.dataset.tab === "matrix" ? (route.area || AREAS[0]) : null };
    filter.only = null; window.scrollTo(0, 0); render();
  });
  v.querySelectorAll("[data-area]").forEach(b => b.onclick = () => {
    route = { v:"area", area:b.dataset.area }; window.scrollTo(0, 0); render(); });
  v.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => {
    route = { v:"matrix", area:b.dataset.mx }; window.scrollTo(0, 0); render(); });
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    route = { v:b.dataset.go, area:null }; window.scrollTo(0, 0); render(); });
  v.querySelectorAll("[data-only]").forEach(b => b.onclick = () => {
    const val = b.dataset.only || null;
    filter.only = filter.only === val ? null : val;
    if (route.v === "board") route = { v:"mine", area:null };
    window.scrollTo(0, 0); render();
  });
  v.querySelectorAll("[data-editp]").forEach(b => b.onclick = () => personSheet(b.dataset.editp));
  v.querySelectorAll("[data-beid]").forEach(b => b.onclick = () => {
    me = personById(b.dataset.beid); lsSet(LS.me, me.id);
    route = { v:"board", area:null }; window.scrollTo(0, 0); render(); });
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = addSheet);
  v.querySelectorAll("[data-watch]").forEach(b => b.onclick = watchSheet);
  v.querySelectorAll("[data-about]").forEach(b => b.onclick = aboutSheet);
  v.querySelectorAll("[data-flagf]").forEach(b => b.onclick = () => { filter.flag = !filter.flag; render(); });
  v.querySelectorAll("[data-scrollnn]").forEach(b => b.onclick = () => {
    const el = document.getElementById("nn"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); });
  v.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => {
    const r = document.documentElement, cur = r.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
  const q = v.querySelector("#q");
  if (q) { let t2; q.oninput = e => { const val = e.target.value;
    clearTimeout(t2); t2 = setTimeout(() => { filter.q = val.trim();
      const at = document.activeElement === q; render();
      if (at) { const n2 = document.querySelector("#q"); if (n2) { n2.focus(); n2.setSelectionRange(n2.value.length, n2.value.length); } }
    }, 200); }; }
  const mw = v.querySelector("#msWahl"), ma = v.querySelector("#msAnms");
  if (mw) mw.onchange = () => { milestones.wahl = mw.value; writeTeam(); toast("Termin übernommen"); };
  if (ma) ma.onchange = () => { milestones.anms = ma.value; writeTeam(); toast("Termin übernommen"); };
}
document.getElementById("meBtn").onclick = pickerSheet;

(async function start() {
  await initStore();
  const saved = lsGet(LS.me, null);
  me = (saved && personById(saved)) || null;
  render();
  if (!me) pickerSheet();
})();
</script>

<title>JCNetwork Days RACI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --accent:#226D94; --accent-2:#17516f; --accent-wash:#e8f0f5;
  --ink:#14202a; --ink-2:#516069; --ink-3:#8a969e;
  --paper:#eef0f2; --card:#fff; --card-2:#f7f8f9;
  --line:#e1e5e9; --hair:#ebeef0;
  --late:#ae4436; --late-wash:#fbeeec;
  --soon:#9a7115; --soon-wash:#faf2e1;
  --done:#48796a; --done-wash:#e9f1ee;
  --r:14px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lift:0 1px 2px rgba(20,32,42,.04),0 8px 24px -12px rgba(20,32,42,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#68b0d4; --accent-2:#9bcde5; --accent-wash:#152e3c;
  --ink:#e8edf1; --ink-2:#9fadb6; --ink-3:#6f7d87;
  --paper:#0f1418; --card:#171d23; --card-2:#1c242b;
  --line:#28323a; --hair:#222b32;
  --late:#e28c7e; --late-wash:#33201c;
  --soon:#d3aa5c; --soon-wash:#2e2614;
  --done:#7fb9a5; --done-wash:#1a2a26;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --accent:#68b0d4; --accent-2:#9bcde5; --accent-wash:#152e3c;
  --ink:#e8edf1; --ink-2:#9fadb6; --ink-3:#6f7d87;
  --paper:#0f1418; --card:#171d23; --card-2:#1c242b;
  --line:#28323a; --hair:#222b32;
  --late:#e28c7e; --late-wash:#33201c;
  --soon:#d3aa5c; --soon-wash:#2e2614;
  --done:#7fb9a5; --done-wash:#1a2a26;
  --lift:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.disp{font-family:var(--disp);font-variation-settings:"SOFT" 0,"WONK" 0;letter-spacing:-.012em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Kopfzeile ---------- */
header.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1000px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;height:58px}
.mark{display:flex;align-items:baseline;gap:8px;flex:none}
.mark b{font:600 16px/1 var(--disp);letter-spacing:-.01em}
.mark span{font:400 11px/1 var(--mono);color:var(--ink-3);letter-spacing:.04em}
nav.tabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:6px 11px;border-radius:8px;cursor:pointer;
  font-size:14px;color:var(--ink-2);white-space:nowrap}
nav.tabs button:hover{background:var(--card);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--lift)}
.bar .sp{flex:1}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.me-btn:hover{border-color:var(--accent)}
.me-btn .nm{font-size:13.5px;font-weight:600;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font:600 11px var(--mono);color:#fff}
.av.sm{width:21px;height:21px;font-size:9px} .av.lg{width:44px;height:44px;font-size:16px}

main{max-width:1000px;margin:0 auto;padding:34px 24px 90px}

/* ---------- Begruessung + Zeitstrahl ---------- */
.hello{margin-bottom:30px}
.hello h1{font:500 34px/1.15 var(--disp);letter-spacing:-.018em}
.hello .sub{color:var(--ink-2);margin-top:6px;font-size:15px}
.hello .sub b{color:var(--ink);font-weight:600}
.trail{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 20px 13px}
.trail-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}
.trail-top .now{font-size:13.5px;color:var(--ink-2)}
.trail-top .now b{color:var(--ink);font-weight:600}
.trail-top .cd{font:500 13px var(--mono);color:var(--accent)}
.track{position:relative;height:3px;background:var(--hair);border-radius:2px;margin:0 0 9px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.track .pin{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--accent);
  border:2.5px solid var(--card);transform:translate(-50%,-50%)}
.ticks{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--ink-3)}
.ticks span{flex:1;text-align:center}
.ticks span:first-child{text-align:left} .ticks span:last-child{text-align:right}
.ticks span.on{color:var(--accent);font-weight:500}

/* ---------- Abschnitte ---------- */
section{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-h h2{font:600 19px/1.25 var(--disp);letter-spacing:-.012em}
.sec-h .n{font:400 13px var(--mono);color:var(--ink-3)}
.sec-h .more{margin-left:auto;font-size:13.5px;color:var(--accent);background:none;border:0;
  cursor:pointer;padding:2px 0}
.sec-h .more:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Aufgabenliste ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:12px 17px;border:0;background:none;width:100%;
  text-align:left;cursor:pointer;border-top:1px solid var(--hair);font:inherit;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--card-2)}
.tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;background:var(--card)}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--done);border-color:var(--done)}
.tick svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;display:none}
.tick.on svg{display:block}
.row .mid{flex:1;min-width:0}
.row .t{font-size:14.5px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.row.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.row .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;
  font-size:12.5px;color:var(--ink-3)}
.row .when{font:500 12.5px var(--mono);color:var(--ink-2);white-space:nowrap;flex:none;text-align:right}
.row .when.late{color:var(--late)} .row .when.soon{color:var(--soon)}
.row .fl{color:var(--late);flex:none;font-size:13px}
.tag{font-size:12px;color:var(--ink-3)}
.tag.dot::before{content:"·";margin-right:8px}
.own{display:inline-flex;gap:-4px;align-items:center}
.lead{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;
  font-size:11.5px;font-weight:600;line-height:1.6}
.pill.late{background:var(--late-wash);color:var(--late)}
.pill.soon{background:var(--soon-wash);color:var(--soon)}
.pill.done{background:var(--done-wash);color:var(--done)}
.pill.info{background:var(--accent-wash);color:var(--accent-2)}
.pill.plain{background:var(--card-2);color:var(--ink-2)}

/* ---------- Hinweiskarte ---------- */
.callout{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 18px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.callout:hover{border-color:var(--late)}
.callout .big{font:500 27px/1 var(--mono);color:var(--late);flex:none}
.callout .tx{flex:1;min-width:0}
.callout .tx b{display:block;font-size:14.5px;font-weight:600}
.callout .tx span{font-size:13px;color:var(--ink-2)}
.callout .go{color:var(--ink-3);font-size:18px;flex:none}

/* ---------- Bereichskarten ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:14px;align-items:flex-start}
.card:hover{border-color:var(--accent);box-shadow:var(--lift)}
.card .tx{flex:1;min-width:0}
.card h3{font:600 15.5px/1.3 var(--sans);letter-spacing:-.005em}
.card .who{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px}
.card .fig{font:400 12.5px var(--mono);color:var(--ink-3);margin-top:9px}
.card .fig .l{color:var(--late)}
.ring{flex:none;width:44px;height:44px;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--hair)} .ring .fg{stroke:var(--done);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;
  font:500 11px var(--mono);color:var(--ink-2)}

/* ---------- Zeitplan ---------- */
.ph{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;padding:15px 0;
  border-top:1px solid var(--hair);align-items:center}
.ph:first-of-type{border-top:0}
.ph.now{background:var(--accent-wash);border-radius:var(--r);padding-left:16px;padding-right:16px;border-top-color:transparent}
.ph h4{font:600 15px/1.3 var(--sans)}
.ph .dt{font:400 11.5px var(--mono);color:var(--ink-3);margin-top:2px}
.phbar{height:8px;border-radius:5px;background:var(--hair);display:flex;overflow:hidden;margin-bottom:7px}
.phbar i{height:100%}
.ph .mt{font-size:12.5px;color:var(--ink-2)}
.ph .mt b{font-weight:600}

/* ---------- Matrix ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button:hover{border-color:var(--accent)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.mx-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:780px;width:100%}
table.mx th,table.mx td{padding:7px 7px;border-top:1px solid var(--hair);text-align:center}
table.mx thead th{position:sticky;top:0;background:var(--card-2);z-index:2;border-top:0;
  font:500 11px var(--mono);color:var(--ink-2);padding:10px 6px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
table.mx th.tn,table.mx td.tn{text-align:left;min-width:290px;position:sticky;left:0;
  background:var(--card);font-weight:400;font-size:13.5px}
table.mx thead th.tn{background:var(--card-2);z-index:3}
table.mx tbody tr:hover td,table.mx tbody tr:hover td.tn{background:var(--card-2)}
table.mx td.wd{font:400 11.5px var(--mono);color:var(--ink-3);white-space:nowrap}
.rc{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;
  font:600 11px var(--mono)}
.rc.A{background:var(--accent);color:#fff}
.rc.R{background:var(--accent-wash);color:var(--accent-2)}
.rc.C{background:var(--soon-wash);color:var(--soon)}
.rc.I{background:var(--card-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.rc.S{background:var(--done-wash);color:var(--done)}
.rc.opt{opacity:.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Team ---------- */
.grp-h{margin:26px 0 12px}
.grp-h h3{font:600 17px/1.3 var(--disp)}
.grp-h p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.grp-h:first-child{margin-top:0}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pc.nn{border-style:dashed}
.pc .top{display:flex;gap:12px;align-items:center}
.pc .nm{font-size:16px;font-weight:600;line-height:1.25}
.pc .rl{font-size:12.5px;color:var(--ink-2)}
.pc .ar{margin-top:11px;display:flex;flex-wrap:wrap;gap:5px}
.pc .fg{margin-top:11px;font:400 12.5px var(--mono);color:var(--ink-3)}
.pc .fg b{color:var(--ink);font-weight:600} .pc .fg .l{color:var(--late)}
.pc .ed{margin-top:12px;display:flex;gap:7px}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);padding:7px 13px;font-size:13.5px;
  font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.gho{border-color:transparent;background:none;color:var(--ink-2)}
.btn.gho:hover{background:var(--card-2);color:var(--ink)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;
  color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px;font-weight:600}
.toolrow{display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;
  font-size:13.5px;width:230px;max-width:100%}

/* ---------- Dialoge ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,27,.42);z-index:60;display:flex;
  align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.sheet{background:var(--card);border-radius:18px;box-shadow:0 24px 60px -18px rgba(0,0,0,.4);
  width:100%;max-width:580px;border:1px solid var(--line);overflow:hidden;margin:auto}
.sheet.wide{max-width:840px}
.sh-h{padding:20px 22px 16px;border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:flex-start}
.sh-h h3{font:500 21px/1.3 var(--disp);flex:1;letter-spacing:-.012em}
.sh-b{padding:20px 22px}
.sh-f{padding:14px 22px;border-top:1px solid var(--hair);display:flex;gap:9px;align-items:center;
  background:var(--card-2);flex-wrap:wrap}
.x{background:none;border:0;font-size:21px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px;flex:none}
.x:hover{color:var(--ink)}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14px;background:var(--card)}
.fld textarea{resize:vertical;min-height:74px;font-family:var(--sans)}
.fld .hint{font-size:12px;color:var(--ink-3);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:78px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:8px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--card);font-weight:400}
.checks label:has(input:checked){background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2)}
.checks input{margin:0;accent-color:var(--accent)}
.facts{display:flex;gap:26px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--hair);margin-bottom:17px}
.fact .k{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.fact .v{font-size:14.5px;font-weight:600}
.fact .v.late{color:var(--late)}
.fact .v span{font-weight:400;color:var(--ink-3);font-size:13px}
.role-line{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--hair)}
.role-line:first-of-type{border-top:0}
.role-line .lbl{flex:none;width:132px;font-size:13px;font-weight:600;color:var(--ink-2)}
.role-line .ppl{flex:1;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.who-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border-radius:999px;
  padding:3px 11px 3px 3px;font-size:13px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.pick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:11px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pick:hover{border-color:var(--accent);background:var(--accent-wash)}
.pick .nm{font-weight:600;font-size:14px;line-height:1.25;display:block}
.pick .rl{font-size:12px;color:var(--ink-3);line-height:1.3;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);
  color:var(--paper);padding:10px 17px;border-radius:10px;font-size:13.5px;
  box-shadow:var(--lift);max-width:calc(100% - 32px)}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:18px;
  flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--ink-3);cursor:pointer;font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--accent)}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--done)} .dot.off{background:var(--soon)}

@media (max-width:720px){
  body{font-size:14.5px}
  .bar-in{height:54px;padding:0 16px;gap:10px}
  .mark span{display:none}
  main{padding:26px 16px 80px}
  .hello h1{font-size:27px}
  .me-btn .nm{display:none} .me-btn{padding:4px}
  .ph{grid-template-columns:1fr;gap:8px}
  .ph.now{padding-left:14px;padding-right:14px}
  .two{grid-template-columns:1fr}
  .row{padding:11px 14px;gap:11px}
  .row .when{font-size:11.5px}
  .facts{gap:18px}
  .ticks{display:none}
  .trail{padding:15px 16px 13px}
  .trail-top{flex-direction:column;gap:3px}
  .role-line{flex-direction:column;gap:6px} .role-line .lbl{width:auto}
}

/* ---------- Betrieb: gemeinsame Bausteine ---------- */
.seg-nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:20px;width:fit-content;max-width:100%;
  overflow-x:auto;scrollbar-width:none}
.seg-nav::-webkit-scrollbar{display:none}
.seg-nav button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;
  font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg-nav button:hover{color:var(--ink)}
.seg-nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.daybar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}

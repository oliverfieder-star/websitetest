# Render-Blueprint für das Planungsboard der JCNetwork Days 2026.
#
# Einrichten: auf render.com „New → Blueprint", dieses Repository wählen.
# Render legt beide Dienste an und fragt die Werte ab, die hier als
# sync:false stehen.
#
# ACHTUNG: Eine Render-Static-Site ist öffentlich erreichbar. Im Board stehen
# Telefonnummern von Helfenden. Entweder in den Einstellungen der Site einen
# Passwortschutz einschalten, oder die Seite hinter Cloudflare Access hängen.
# Siehe jcnetwork-days/README.md, Abschnitt „Selbst hosten".

services:
  # Das Board als reine Dateien. FREIWILLIG: Render bietet für Static Sites
  # keinen Passwortschutz. Wer einen braucht, lässt diesen Dienst weg — der
  # Dienst jcnd-mcp unten liefert das Board ebenfalls aus, dann hinter
  # Passwort.
  - type: web
    name: jcnd-board
    runtime: static
    rootDir: jcnetwork-days
    staticPublishPath: .
    # Schreibt config.js aus den Umgebungsvariablen. Das Repository ist
    # öffentlich — der Supabase-Key darf deshalb nicht eingecheckt werden.
    buildCommand: ./build.sh
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # Liefert zwei Dinge aus:
  #   1. das Board unter / — hinter Passwort, wenn BOARD_PASSWORD gesetzt ist
  #   2. den MCP-Server unter /mcp/<token> für die Claude-App jeder Person
  - type: web
    name: jcnd-mcp
    runtime: node
    plan: free
    rootDir: jcnetwork-days/mcp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /gesund
    envVars:
      # Render würfelt den Token beim ersten Deploy aus; danach im
      # Dashboard nachlesen und in die Connector-URL einsetzen.
      - key: MCP_TOKEN
        generateValue: true
      # Passwort fürs Board. Ohne diesen Wert ist das Board offen erreichbar.
      - key: BOARD_PASSWORD
        sync: false
      - key: BOARD_USER
        value: team
      # Dieselben Werte wie im Board.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
